packages:
  - "apps/*"
  - "packages/*"

overrides:
  "xcode@3.0.1>uuid": "11.1.1"

allowBuilds:
  # ESLint's resolver ships prebuilt binaries; do not execute its install script.
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.15'
  - '@expo/config-plugins@57.0.8'
  - '@expo/metro-runtime@57.0.10'
  - '@expo/prebuild-config@57.0.12'
  - '@expo/router-server@57.0.6'
  - '@expo/ui@57.0.11'
  - babel-preset-expo@57.0.7
  - expo-asset@57.0.11
  - expo-constants@57.0.11
  - expo-file-system@57.0.3
  - expo-image@57.0.3
  - expo-linking@57.0.6
  - expo-modules-autolinking@57.0.10
  - expo-modules-core@57.0.11
  - expo-router@57.0.13
  - expo-server@57.0.3
  - expo@57.0.13
  - expo-calendar@57.0.2
  - expo-dev-client@57.0.12
  - expo-dev-launcher@57.0.12
  - expo-dev-menu@57.0.12
  - expo-notifications@57.0.11

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - "esbuild"
