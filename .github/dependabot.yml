version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      expo-compatible:
        patterns:
          - "expo*"
          - "@expo/*"
          - "react-native*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
